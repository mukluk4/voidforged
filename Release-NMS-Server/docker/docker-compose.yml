# Voidforged in Docker: the game server, login server and database. See README.md in this folder.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set it in .env}
      MARIADB_DATABASE: ${DB_NAME:-peq}
    command: ["--innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}", "--max-allowed-packet=256M"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 30
    # No published ports: the database is only reachable from the other containers.

  login:
    image: voidforged-server
    restart: unless-stopped
    entrypoint: ["sh", "/opt/vf/start-login.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      LOGIN_DB_NAME: ${LOGIN_DB_NAME:-voidforged_login}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set it in .env}
      LOGIN_AUTO_CREATE_ACCOUNTS: ${LOGIN_AUTO_CREATE_ACCOUNTS:-true}
    # World reaches the login server's TCP 5998 inside Docker; only the client ports are published.
    ports:
      - "5998:5998/udp"
      - "5999:5999/udp"
    volumes:
      - login:/data

  server:
    image: voidforged-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_JOBS: ${BUILD_JOBS:-1}
    restart: unless-stopped
    # The crash handler attaches gdb to the crashing zone, which needs ptrace
    cap_add:
      - SYS_PTRACE
    depends_on:
      db:
        condition: service_healthy
      login:
        condition: service_started
    environment:
      DB_NAME: ${DB_NAME:-peq}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set it in .env}
      SERVER_SHORTNAME: ${SERVER_SHORTNAME:-Voidforged}
      SERVER_LONGNAME: ${SERVER_LONGNAME:-Voidforged}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:?set it in .env}
      WORLD_KEY: ${WORLD_KEY:?set it in .env}
      LOGIN_HOST: login
      LOGIN_PORT: "5998"
    ports:
      - "9000:9000/udp"
      - "7001-7030:7001-7030/udp"
    volumes:
      - ${RUNTIME_DIR:?set it in .env}:/runtime:ro
      - data:/data

  # OOC <-> Discord bridge (discord-bridge/bridge.py). It logs into world's console on TCP 9001, which is only
  # reachable inside this compose network. Idles until DISCORD_TOKEN and DISCORD_CHANNEL_ID are set.
  discord:
    build: ./discord-bridge
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      CONSOLE_HOST: server
      CONSOLE_PORT: "9001"
      CONSOLE_USER: ${CONSOLE_USER:-discordbridge}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-}

  # VoidPatcher's files (manifest.txt and objects/), uploaded by utils/patcher/publish_box.sh. Plain static files:
  # nginx handles the Range requests the patcher resumes downloads with.
  patch:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PATCH_BIND:-0.0.0.0}:${PATCH_PORT:-8088}:80"
    volumes:
      - ${PATCH_DIR:?set it in .env}:/usr/share/nginx/html:ro

volumes:
  db:
  login:
  data:
